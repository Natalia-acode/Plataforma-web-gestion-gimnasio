  <path d="M170,107 L258,135 L170,163 L82,135 Z" fill="#fff8e6" stroke="#b7791f"/><text x="170" y="131" text-anchor="middle" font-size="10.5" fill="#6b4a12">¿Ya tiene cuenta</text><text x="170" y="145" text-anchor="middle" font-size="10.5" fill="#6b4a12">de cliente?</text>
  <rect x="430" y="110" width="210" height="48" rx="18" fill="#ffffff" stroke="#1e3a5f"/><text x="535" y="130" text-anchor="middle" font-size="11" fill="#22384d">Crea la cuenta de cliente</text><text x="535" y="146" text-anchor="middle" font-size="11" fill="#22384d">y elige el plan</text>
  <rect x="80" y="195" width="180" height="40" rx="18" fill="#ffffff" stroke="#1e3a5f"/><text x="170" y="219" text-anchor="middle" font-size="11" fill="#22384d">Registra el pago en efectivo</text>
  <rect x="80" y="262" width="180" height="44" rx="18" fill="#ffffff" stroke="#1e3a5f"/><text x="170" y="280" text-anchor="middle" font-size="11" fill="#22384d">Crea la suscripción</text><text x="170" y="296" text-anchor="middle" font-size="11" fill="#22384d">activa en la sede</text>
  <rect x="80" y="332" width="180" height="40" rx="18" fill="#ffffff" stroke="#1e3a5f"/><text x="170" y="356" text-anchor="middle" font-size="11" fill="#22384d">Entrega el QR de acceso</text>
  <circle cx="170" cy="410" r="10" fill="none" stroke="#1e3a5f" stroke-width="2"/><circle cx="170" cy="410" r="5" fill="#1e3a5f"/>

  <g stroke="#475569" stroke-width="1.4" fill="none">
    <path d="M170,45 V58" marker-end="url(#ar)"/>
    <path d="M170,98 V107" marker-end="url(#ar)"/>
    <path d="M170,163 V195" marker-end="url(#ar)"/><text x="178" y="183" font-size="10.5" fill="#33475b" stroke="none">sí</text>
