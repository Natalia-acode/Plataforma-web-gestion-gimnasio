<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <g font-size="11" fill="#1e3a5f" font-weight="bold">
    <rect x="0" y="34" width="124" height="80" fill="#eef4fb" stroke="#c3d3e6"/><text x="12" y="78">Cliente</text>
    <rect x="0" y="114" width="124" height="80" fill="#eef4fb" stroke="#c3d3e6"/><text x="12" y="158">Empleado</text>
    <rect x="0" y="194" width="124" height="80" fill="#eef4fb" stroke="#c3d3e6"/><text x="12" y="238">Sistema</text>
    <rect x="0" y="274" width="124" height="80" fill="#eef4fb" stroke="#c3d3e6"/><text x="12" y="318">Pasarela</text>
  </g>
  <line x1="124" y1="34" x2="950" y2="34" stroke="#c3d3e6"/>
  <line x1="124" y1="114" x2="950" y2="114" stroke="#c3d3e6"/>
  <line x1="124" y1="194" x2="950" y2="194" stroke="#c3d3e6"/>
  <line x1="124" y1="274" x2="950" y2="274" stroke="#c3d3e6"/>
  <line x1="124" y1="354" x2="950" y2="354" stroke="#c3d3e6"/>

  <g font-size="10" fill="#22384d" text-anchor="middle">
    <rect x="130" y="50" width="104" height="48" rx="6" fill="#ffffff" stroke="#1e3a5f"/><text x="182" y="70">Decide</text><text x="182" y="84">afiliarse</text>
    <rect x="240" y="50" width="104" height="48" rx="6" fill="#ffffff" stroke="#1e3a5f"/><text x="292" y="70">Elige un plan</text><text x="292" y="84">y acepta</text>
    <rect x="350" y="50" width="104" height="48" rx="6" fill="#ffffff" stroke="#1e3a5f"/><text x="402" y="66">Aporta tarjeta y</text><text x="402" y="80">autoriza la</text><text x="402" y="94">renovación</text>
    <rect x="680" y="50" width="104" height="48" rx="6" fill="#ffffff" stroke="#1e3a5f"/><text x="732" y="70">Recibe factura</text><text x="732" y="84">y avisos</text>

    <rect x="130" y="130" width="104" height="48" rx="6" fill="#ffffff" stroke="#1e3a5f"/><text x="182" y="150">Atiende la venta</text><text x="182" y="164">presencial</text>
    <rect x="240" y="130" width="104" height="48" rx="6" fill="#ffffff" stroke="#1e3a5f"/><text x="292" y="150">Registra el pago</text><text x="292" y="164">en efectivo</text>

    <rect x="350" y="210" width="104" height="48" rx="6" fill="#ffffff" stroke="#1e3a5f"/><text x="402" y="230">Valida datos y</text><text x="402" y="244">crea la cuenta</text>
    <rect x="460" y="210" width="104" height="48" rx="6" fill="#ffffff" stroke="#1e3a5f"/><text x="512" y="230">Guarda el token</text><text x="512" y="244">(nunca la tarjeta)</text>
    <rect x="570" y="210" width="104" height="48" rx="6" fill="#ffffff" stroke="#1e3a5f"/><text x="622" y="230">Activa la</text><text x="622" y="244">suscripción</text>
    <rect x="680" y="210" width="104" height="48" rx="6" fill="#ffffff" stroke="#1e3a5f"/><text x="732" y="230">Programa</text><text x="732" y="244">renovación</text>

    <rect x="460" y="290" width="104" height="48" rx="6" fill="#ffffff" stroke="#1e3a5f"/><text x="512" y="310">Tokeniza y</text><text x="512" y="324">aprueba el cargo</text>
    <rect x="790" y="290" width="104" height="48" rx="6" fill="#ffffff" stroke="#1e3a5f"/><text x="842" y="310">Cobra la</text><text x="842" y="324">renovación</text>
  </g>

  <g stroke="#475569" stroke-width="1.4" fill="none">
    <path d="M234,74 H240" marker-end="url(#ar)"/>
    <path d="M344,74 H350" marker-end="url(#ar)"/>
    <path d="M402,98 V210" marker-end="url(#ar)"/>
    <path d="M234,154 H240" marker-end="url(#ar)"/>
    <path d="M344,162 L392,210" marker-end="url(#ar)"/>
    <path d="M454,234 H460" marker-end="url(#ar)"/>
    <path d="M564,234 H570" marker-end="url(#ar)"/>
    <path d="M674,234 H680" marker-end="url(#ar)"/>
    <path d="M402,258 L470,290" marker-end="url(#ar)"/>
    <path d="M512,290 V258" marker-end="url(#ar)"/>
    <path d="M732,210 V98" marker-end="url(#ar)"/>
    <path d="M784,240 L834,290" marker-end="url(#ar)"/>
  </g>

  <text x="130" y="378" font-size="10.5" fill="#33475b">La renovación automática solo se cobra si el cliente la autorizó expresamente (opt-in) y siempre va precedida de recordatorios a 7 y 1 día.</text>
</svg>
