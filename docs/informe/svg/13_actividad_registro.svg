    <path d="M480,168 V220" marker-end="url(#ar)"/><text x="488" y="196" fill="#33475b" stroke="none">sí</text>
    <path d="M480,270 V302" marker-end="url(#ar)"/>
    <path d="M390,330 H320 V400" marker-end="url(#ar)"/><text x="340" y="322" fill="#33475b" stroke="none">sí</text>
