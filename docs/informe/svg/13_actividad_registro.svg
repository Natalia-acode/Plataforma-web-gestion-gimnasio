<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <circle cx="170" cy="36" r="9" fill="#1e3a5f"/>
  <rect x="80" y="58" width="180" height="40" rx="18" fill="#ffffff" stroke="#1e3a5f"/><text x="170" y="82" text-anchor="middle" font-size="11" fill="#22384d">Cumplimenta el formulario</text>
  <path d="M170,114 L240,140 L170,166 L100,140 Z" fill="#fff8e6" stroke="#b7791f"/><text x="170" y="144" text-anchor="middle" font-size="10.5" fill="#6b4a12">¿Rol de cliente?</text>
  <rect x="80" y="196" width="180" height="44" rx="18" fill="#ffffff" stroke="#1e3a5f"/><text x="170" y="214" text-anchor="middle" font-size="11" fill="#22384d">Crea cuenta ACTIVA</text><text x="170" y="228" text-anchor="middle" font-size="11" fill="#22384d">e inicia sesión</text>
  <circle cx="170" cy="286" r="10" fill="none" stroke="#1e3a5f" stroke-width="2"/><circle cx="170" cy="286" r="5" fill="#1e3a5f"/>

  <path d="M480,112 L568,140 L480,168 L392,140 Z" fill="#fff8e6" stroke="#b7791f"/><text x="480" y="136" text-anchor="middle" font-size="10.5" fill="#6b4a12">¿Hay administrador</text><text x="480" y="150" text-anchor="middle" font-size="10.5" fill="#6b4a12">activo?</text>
  <rect x="700" y="116" width="190" height="48" rx="18" fill="#ffffff" stroke="#1e3a5f"/><text x="795" y="136" text-anchor="middle" font-size="11" fill="#22384d">Crea cuenta ACTIVA</text><text x="795" y="152" text-anchor="middle" font-size="11" fill="#22384d">(modo arranque)</text>
  <circle cx="795" cy="220" r="10" fill="none" stroke="#1e3a5f" stroke-width="2"/><circle cx="795" cy="220" r="5" fill="#1e3a5f"/>

  <rect x="370" y="220" width="220" height="50" rx="18" fill="#ffffff" stroke="#1e3a5f"/><text x="480" y="240" text-anchor="middle" font-size="11" fill="#22384d">Cuenta PENDIENTE y avisa</text><text x="480" y="256" text-anchor="middle" font-size="11" fill="#22384d">a los administradores</text>
  <path d="M480,302 L570,330 L480,358 L390,330 Z" fill="#fff8e6" stroke="#b7791f"/><text x="480" y="326" text-anchor="middle" font-size="10.5" fill="#6b4a12">¿El administrador</text><text x="480" y="340" text-anchor="middle" font-size="10.5" fill="#6b4a12">la aprueba?</text>
  <rect x="230" y="400" width="180" height="40" rx="18" fill="#ffffff" stroke="#1e3a5f"/><text x="320" y="424" text-anchor="middle" font-size="11" fill="#22384d">Cuenta ACTIVA</text>
  <rect x="560" y="400" width="180" height="40" rx="18" fill="#ffffff" stroke="#1e3a5f"/><text x="650" y="424" text-anchor="middle" font-size="11" fill="#22384d">Cuenta RECHAZADA</text>
  <circle cx="320" cy="478" r="10" fill="none" stroke="#1e3a5f" stroke-width="2"/><circle cx="320" cy="478" r="5" fill="#1e3a5f"/>
  <circle cx="650" cy="478" r="10" fill="none" stroke="#1e3a5f" stroke-width="2"/><circle cx="650" cy="478" r="5" fill="#1e3a5f"/>

  <g stroke="#475569" stroke-width="1.4" fill="none" font-size="10.5">
    <path d="M170,45 V58" marker-end="url(#ar)"/>
    <path d="M170,98 V114" marker-end="url(#ar)"/>
    <path d="M170,166 V196" marker-end="url(#ar)"/><text x="178" y="184" fill="#33475b" stroke="none">sí</text>
