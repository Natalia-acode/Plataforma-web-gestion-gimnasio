<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <symbol id="actor" viewBox="0 0 24 42" overflow="visible">
      <circle cx="12" cy="7" r="6" fill="none" stroke="#1e3a5f" stroke-width="2"/>
      <path d="M12,13 v12 M2,19 h20 M12,25 l-7 15 M12,25 l7 15" fill="none" stroke="#1e3a5f" stroke-width="2"/>
    </symbol>
  </defs>

  <rect x="368" y="168" width="224" height="196" rx="8" fill="#1e3a5f"/>
  <text x="480" y="196" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="bold">GymFlex</text>
  <text x="480" y="216" text-anchor="middle" fill="#c9dcf0" font-size="11">Sistema de gestión de gimnasio</text>
  <text x="480" y="232" text-anchor="middle" fill="#c9dcf0" font-size="11">multi-sede</text>
  <line x1="388" y1="244" x2="572" y2="244" stroke="#4a6b93" stroke-width="1"/>
  <text x="388" y="266" fill="#ffffff" font-size="11">· Cuentas, roles y aprobaciones</text>
  <text x="388" y="286" fill="#ffffff" font-size="11">· Membresías, pagos y renovaciones</text>
  <text x="388" y="306" fill="#ffffff" font-size="11">· Check-in, aforo y cola virtual</text>
  <text x="388" y="326" fill="#ffffff" font-size="11">· Clases, reservas y reportes por sede</text>

  <use xlink:href="#actor" href="#actor" x="52" y="24" width="24" height="42"/>
  <text x="64" y="86" text-anchor="middle" font-size="12" fill="#1e3a5f" font-weight="bold">Visitante</text>
  <use xlink:href="#actor" href="#actor" x="52" y="116" width="24" height="42"/>
  <text x="64" y="178" text-anchor="middle" font-size="12" fill="#1e3a5f" font-weight="bold">Cliente</text>
  <use xlink:href="#actor" href="#actor" x="52" y="208" width="24" height="42"/>
  <text x="64" y="270" text-anchor="middle" font-size="12" fill="#1e3a5f" font-weight="bold">Empleado</text>
  <use xlink:href="#actor" href="#actor" x="52" y="300" width="24" height="42"/>
  <text x="64" y="362" text-anchor="middle" font-size="12" fill="#1e3a5f" font-weight="bold">Entrenador</text>
  <use xlink:href="#actor" href="#actor" x="52" y="392" width="24" height="42"/>
  <text x="64" y="454" text-anchor="middle" font-size="12" fill="#1e3a5f" font-weight="bold">Administrador</text>
  <text x="64" y="470" text-anchor="middle" font-size="12" fill="#1e3a5f">del gimnasio</text>

  <line x1="92" y1="48" x2="366" y2="212" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="92" y1="140" x2="366" y2="240" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="92" y1="232" x2="366" y2="266" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="92" y1="324" x2="366" y2="292" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="92" y1="416" x2="366" y2="320" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="726" y="104" width="210" height="86" rx="8" fill="#eef4fb" stroke="#1e3a5f" stroke-width="1.4"/>
  <text x="831" y="128" text-anchor="middle" font-size="13" fill="#1e3a5f" font-weight="bold">Pasarela de pago</text>
  <text x="738" y="150" font-size="10.5" fill="#33475b">Recibe el monto y el token de la</text>
  <text x="738" y="166" font-size="10.5" fill="#33475b">tarjeta; devuelve aprobado o</text>
  <text x="738" y="182" font-size="10.5" fill="#33475b">rechazado. El número nunca llega al sistema.</text>

  <rect x="726" y="330" width="210" height="86" rx="8" fill="#eef4fb" stroke="#1e3a5f" stroke-width="1.4"/>
  <text x="831" y="354" text-anchor="middle" font-size="13" fill="#1e3a5f" font-weight="bold">Correo y SMS</text>
  <text x="738" y="376" font-size="10.5" fill="#33475b">Envía recordatorios de cobro (7 y 1</text>
  <text x="738" y="392" font-size="10.5" fill="#33475b">día antes), avisos de turno, confirmaciones</text>
  <text x="738" y="408" font-size="10.5" fill="#33475b">de reserva y enlaces de recuperación.</text>

  <line x1="592" y1="220" x2="724" y2="160" stroke="#475569" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <line x1="592" y1="312" x2="724" y2="368" stroke="#475569" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/>

  <text x="480" y="512" text-anchor="middle" font-size="11.5" fill="#33475b">Las sedes se administran dentro del sistema: cada sede tiene sus zonas, su aforo, sus clases y su personal adscrito.</text>
  <text x="480" y="530" text-anchor="middle" font-size="11.5" fill="#33475b">La membresía del cliente es válida en todas las sedes.</text>
</svg>
