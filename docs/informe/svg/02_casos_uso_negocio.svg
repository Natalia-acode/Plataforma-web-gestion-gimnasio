    <rect x="616" y="220" width="286" height="30" rx="15" fill="#ffffff" stroke="#7f9bbd"/><text x="759" y="239" text-anchor="middle" font-size="11.5" fill="#22384d">UCN-08 Vender en mostrador</text>
  </g>

  <g>
    <rect x="300" y="278" width="620" height="118" rx="10" fill="#f7fafd" stroke="#1e3a5f" stroke-width="1.4"/>
    <text x="316" y="298" font-size="12.5" font-weight="bold" fill="#1e3a5f">P3 · Clases grupales</text>
    <rect x="316" y="312" width="286" height="30" rx="15" fill="#ffffff" stroke="#7f9bbd"/><text x="459" y="331" text-anchor="middle" font-size="11.5" fill="#22384d">UCN-09 Programar clases grupales</text>
