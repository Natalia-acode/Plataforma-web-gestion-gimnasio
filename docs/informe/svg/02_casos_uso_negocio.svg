    <rect x="616" y="182" width="286" height="30" rx="15" fill="#ffffff" stroke="#7f9bbd"/><text x="759" y="201" text-anchor="middle" font-size="11.5" fill="#22384d">UCN-06 Conocer la ocupación</text>
