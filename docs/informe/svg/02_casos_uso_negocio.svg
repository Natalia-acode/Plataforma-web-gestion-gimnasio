  <line x1="80" y1="174" x2="298" y2="118" stroke="#475569" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="80" y1="174" x2="298" y2="205" stroke="#475569" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="80" y1="180" x2="298" y2="330" stroke="#475569" stroke-width="1.4" marker-end="url(#ar)"/>
