  <line x1="80" y1="296" x2="298" y2="240" stroke="#475569" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="80" y1="302" x2="298" y2="452" stroke="#475569" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="80" y1="378" x2="298" y2="352" stroke="#475569" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="80" y1="462" x2="298" y2="300" stroke="#475569" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="80" y1="462" x2="298" y2="76" stroke="#475569" stroke-width="1.4" marker-end="url(#ar)"/>

  <text x="300" y="530" font-size="11" fill="#33475b">El administrador supervisa los cuatro procesos; en este diagrama solo se trazan sus participaciones directas (afiliación y programación de clases).</text>
