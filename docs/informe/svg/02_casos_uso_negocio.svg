    <rect x="316" y="52" width="286" height="30" rx="15" fill="#ffffff" stroke="#7f9bbd"/><text x="459" y="71" text-anchor="middle" font-size="11.5" fill="#22384d">UCN-01 Afiliarse al gimnasio</text>
    <rect x="616" y="52" width="286" height="30" rx="15" fill="#ffffff" stroke="#7f9bbd"/><text x="759" y="71" text-anchor="middle" font-size="11.5" fill="#22384d">UCN-02 Contratar una membresía</text>
    <rect x="316" y="90" width="286" height="30" rx="15" fill="#ffffff" stroke="#7f9bbd"/><text x="459" y="109" text-anchor="middle" font-size="11.5" fill="#22384d">UCN-03 Cobrar la renovación</text>
    <rect x="616" y="90" width="286" height="30" rx="15" fill="#ffffff" stroke="#7f9bbd"/><text x="759" y="109" text-anchor="middle" font-size="11.5" fill="#22384d">UCN-04 Cancelar la membresía</text>
