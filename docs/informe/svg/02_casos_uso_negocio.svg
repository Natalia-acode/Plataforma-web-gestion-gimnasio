<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <symbol id="actor" viewBox="0 0 24 42" overflow="visible">
      <circle cx="12" cy="7" r="6" fill="none" stroke="#1e3a5f" stroke-width="2"/>
      <path d="M12,13 v12 M2,19 h20 M12,25 l-7 15 M12,25 l7 15" fill="none" stroke="#1e3a5f" stroke-width="2"/>
