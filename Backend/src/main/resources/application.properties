spring.application.name=gestion-gimnasio-backend
spring.profiles.active=dev

server.port=8080

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=GimnasioDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:CambiarEstaClave123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

spring.jackson.time-zone=America/Bogota
spring.jackson.default-property-inclusion=non_null

gimnasio.jwt.secret=${JWT_SECRET:dev-clave-segura-solo-para-desarrollo-0123456789abcdef}
gimnasio.jwt.expiration-ms=28800000
gimnasio.cors.allowed-origins=http://localhost:5173

springdoc.swagger-ui.path=/swagger-ui.html
