spring.application.name=gestion-gimnasio-backend

server.port=8080

# Conexión a Microsoft SQL Server
# Usuario de SQL Server (crear login en la BD: ver BD/crear_login.sql)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=GimnasioDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=gym_app
spring.datasource.password=GymApp123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

spring.jackson.time-zone=America/Bogota
spring.jackson.default-property-inclusion=non_null

gimnasio.jwt.secret=${JWT_SECRET:dev-clave-segura-solo-para-desarrollo-0123456789abcdef}
gimnasio.jwt.expiration-ms=28800000
gimnasio.cors.allowed-origins=http://localhost:5173
gimnasio.gateway.mode=${GIMNASIO_GATEWAY_MODE:simulada}
gimnasio.gateway.base-url=${GIMNASIO_GATEWAY_BASE_URL:}
gimnasio.gateway.api-key=${GIMNASIO_GATEWAY_API_KEY:}

springdoc.swagger-ui.path=/swagger-ui.html
